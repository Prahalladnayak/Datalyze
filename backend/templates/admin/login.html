<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Datalyze</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0f1e;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .logo p {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 4px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      margin-left: 2px;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 16px;
      color: #e2e8f0;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 18px;
    }
    input:focus { border-color: #6366f1; }
    button[type="submit"] {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 4px;
    }
    button:hover { opacity: 0.88; }
    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.83rem;
      color: #f87171;
      margin-bottom: 18px;
    }
    .shield {
      font-size: 0.73rem;
      color: #475569;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Datalyze</h1>
      <p>Admin Access</p>
    </div>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/admin/login">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required
             placeholder="admin@company.com" autocomplete="email" />

      <label for="password">Password</label>
      <input id="password" type="password" name="password" required
             placeholder="••••••••" autocomplete="current-password" />

      <button type="submit">Sign in to Admin Panel</button>
    </form>

    <p class="shield">🔒 Restricted access — authorised personnel only</p>
  </div>
</body>
</html>
